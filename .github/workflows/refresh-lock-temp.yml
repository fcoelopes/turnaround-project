name: refresh-lock-temp

on:
  push:
    branches: [feat/sqlite-execution-persistence]
    paths:
      - pyproject.toml
      - .github/workflows/refresh-lock-temp.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sqlite-execution-persistence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh uv.lock
        run: |
          python -m pip install --upgrade uv
          uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh uv lock for persistence dependencies"
          git push origin HEAD:feat/sqlite-execution-persistence
