name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with production lock
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen
          uv pip install pytest

      - name: Verify runtime dependencies
        run: |
          uv run python -c "import reportlab; print('reportlab', reportlab.Version)"

      - name: Compile UI
        run: uv run python -m compileall -q app.py pages turnaround

      - name: Test
        run: uv run pytest -q

      - name: Validate deploy stack
        env:
          DOMAIN: turnaround.example.com
        run: |
          bash -n scripts/deploy_vps.sh
          test -f deploy/systemd/turnaround.service
          grep -q '^ExecStart=.*/streamlit run app.py' deploy/systemd/turnaround.service
          docker compose config -q
          docker build -t turnaround-project:test .
