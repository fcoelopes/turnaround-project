services:
  app:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "8501"
    networks:
      - turnaround

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - turnaround

networks:
  turnaround:

volumes:
  caddy_data:
  caddy_config:
